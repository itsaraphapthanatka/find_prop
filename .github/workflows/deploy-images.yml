# build image ของ HOP (ARM64) ให้เครื่อง edgexpert ดึงไปรัน — เครื่องไม่ต้อง build เอง
# (แรมเครื่องถูก vLLM จองไว้เกือบหมด build เว็บบนเครื่องเสี่ยง OOM ไปโดนบริการอื่น)
# ได้ image: ghcr.io/<owner>/hop-api และ hop-web แท็ก <commit sha> + ชื่อ branch (main / edgexpert)
# ใช้งานบนเครื่อง: ./deploy/deploy.sh (รอ image ของ commit ที่ checkout อยู่ แล้วรันใหม่)
name: Deploy images

on:
  push:
    branches: [main, deploy/edgexpert]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # runner ARM64 ฟรีสำหรับ repo สาธารณะ — build native ไม่ต้องจำลอง (เร็วกว่า QEMU มาก)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      BRANCH_TAG: ${{ github.ref_name == 'main' && 'main' || 'edgexpert' }}
    steps:
      - uses: actions/checkout@v4

      # ค่า public ของ Supabase (อยู่ในบันเดิลเว็บอยู่แล้ว — ด่านจริงคือ RLS) ดึงจากเว็บที่ใช้งานอยู่
      # ไม่ต้องตั้ง secret · ลองโดเมนใหม่ก่อน ถ้ายังไม่เปิดใช้ค่อยถอยไป Vercel
      - name: Extract public config from live site
        run: |
          set -euo pipefail
          for SITE in https://hopai.online https://hob-alpha.vercel.app; do
            BUNDLE=$(curl -fsSL "$SITE/" 2>/dev/null | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
            [ -n "$BUNDLE" ] || continue
            curl -fsSL "$SITE/$BUNDLE" -o /tmp/bundle.js || continue
            URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' /tmp/bundle.js | head -1 || true)
            KEY=$(grep -oE 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' /tmp/bundle.js | head -1 || true)
            if [ -n "$URL" ] && [ -n "$KEY" ]; then
              echo "::add-mask::$KEY"
              echo "VITE_SUPABASE_URL=$URL" >> "$GITHUB_ENV"
              echo "VITE_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"
              echo "ใช้ค่าจาก $SITE"
              exit 0
            fi
          done
          echo "ดึงค่า Supabase จากเว็บไม่ได้"; exit 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push hop-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/hop-api:${{ github.sha }}
            ${{ env.REGISTRY }}/hop-api:${{ env.BRANCH_TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=hop-api
          cache-to: type=gha,scope=hop-api,mode=max

      - name: Build + push hop-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ env.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ env.VITE_SUPABASE_ANON_KEY }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/hop-web:${{ github.sha }}
            ${{ env.REGISTRY }}/hop-web:${{ env.BRANCH_TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=hop-web
          cache-to: type=gha,scope=hop-web,mode=max
