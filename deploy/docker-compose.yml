# HOP บนเครื่อง edgexpert (ARM64, ใช้ร่วมกับบริการอื่นหลายสิบตัว) — อัปเดตผ่าน ./deploy/deploy.sh
# image ถูก build บน GitHub Actions (.github/workflows/deploy-images.yml) แล้วเครื่องแค่ pull
#   → ไฟล์นี้ไม่มีส่วน build โดยตั้งใจ: คำสั่ง docker compose ใดๆ จะไม่ build บนเครื่องเอง
#     (แรมเกือบทั้งหมดถูก vLLM จองไว้ build เว็บอาจทำให้ OOM ไปโดนบริการอื่น) · build เอง = deploy.sh --build
# HOP_TAG = commit ที่ deploy ล่าสุด — deploy.sh เขียนลง deploy/.env ให้ (คำสั่ง compose ที่พิมพ์เองจึงใช้ image ตัวเดียวกัน)
# ค่าลับทั้งหมดอยู่ใน deploy/.env (คัดลอกจาก .env.example) — ห้าม commit
name: hop

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    image: ghcr.io/itsaraphapthanatka/hop-api:${HOP_TAG:?ยังไม่มี HOP_TAG — รัน ./deploy/deploy.sh ก่อน}
    env_file: .env
    environment:
      PORT: "3000"
    # เครื่องใช้ร่วมกับบริการอื่น — จำกัดไว้ไม่ให้ HOP กินแรมคนอื่น (ใช้จริงราว 100MB)
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  web:
    image: ghcr.io/itsaraphapthanatka/hop-web:${HOP_TAG:?ยังไม่มี HOP_TAG — รัน ./deploy/deploy.sh ก่อน}
    depends_on:
      api:
        condition: service_healthy
    # เปิดเฉพาะในเครื่องไว้ทดสอบด้วย curl — คนภายนอกเข้าผ่าน Cloudflare Tunnel เท่านั้น
    # (8080/3000 บนเครื่อง edgexpert มีบริการอื่นใช้อยู่ จึงใช้ WEB_PORT ค่าเริ่ม 8098)
    ports:
      - "127.0.0.1:${WEB_PORT:-8098}:8080"
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  # tunnel ของ HOP เอง — ใช้เฉพาะเครื่องที่ยังไม่มี tunnel (เปิดด้วย COMPOSE_PROFILES=tunnel)
  # บน edgexpert ไม่ใช้: ต่อผ่าน tunnel ของเว็บ appreview (คอนเทนเนอร์ cloudflared โหมด host) → localhost:${WEB_PORT}
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging
