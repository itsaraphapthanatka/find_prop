# HOP บนเครื่อง msi-edgexpert-04dc (ARM64) — รันด้วย ./deploy.sh (หรือ docker compose up -d --build ในโฟลเดอร์นี้)
# ค่าลับทั้งหมดอยู่ใน deploy/.env (คัดลอกจาก .env.example) — ห้าม commit
name: hop

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    env_file: .env
    environment:
      PORT: "3000"
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?ตั้ง VITE_SUPABASE_URL ใน deploy/.env}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?ตั้ง VITE_SUPABASE_ANON_KEY ใน deploy/.env}
        GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      api:
        condition: service_healthy
    # เปิดเฉพาะในเครื่อง — คนภายนอกเข้าผ่าน Cloudflare Tunnel เท่านั้น ไม่ต้องเปิดพอร์ตเราเตอร์
    # cloudflared ที่รันเป็น service ของเครื่องอยู่แล้ว ชี้ Public Hostname มาที่ http://localhost:${WEB_PORT}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    logging: *logging

  # ใช้เฉพาะเครื่องที่ยังไม่มี cloudflared — เปิดด้วย COMPOSE_PROFILES=tunnel ใน deploy/.env
  # (เครื่องที่รัน cloudflared เป็น systemd service อยู่แล้ว ไม่ต้องเปิด — เพิ่ม Public Hostname ใน tunnel เดิมแทน)
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped
    logging: *logging
