<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HOP · ชำระเงิน</title>
<style>
  :root { --bg: #f7f6fb; --card: #fff; --ink: #1d1b26; --muted: #6b6878; --brand: #6d4aff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15141a; --card: #1f1d27; --ink: #f1f0f5; --muted: #a29fb0; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: var(--card); border-radius: 18px; padding: 32px 24px; max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  .icon { font-size: 52px; line-height: 1; margin-bottom: 10px; }
  h1 { font-size: 21px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 0; }
  b { color: var(--brand); }
</style>
</head>
<body>
<!-- หน้าปลายทางหลังจ่ายเงิน/จัดการบิล Stripe จาก "แอปมือถือ" (เปิดใน in-app browser)
     แอปจะยืนยันการชำระเงินเองตอนผู้ใช้ปิดหน้านี้ (api/stripe.js action 'confirm') -->
<div class="card">
  <div class="icon" id="icon">✅</div>
  <h1 id="title">ชำระเงินเรียบร้อย</h1>
  <p id="msg">กด <b>ปิด / Done</b> มุมจอเพื่อกลับไปที่แอป HOP — ระบบจะอัปเดตแพ็กเกจให้อัตโนมัติ</p>
</div>
<script>
  var s = new URLSearchParams(location.search).get('s')
  if (s === 'cancel') {
    document.getElementById('icon').textContent = '↩️'
    document.getElementById('title').textContent = 'ยกเลิกการชำระเงิน'
    document.getElementById('msg').innerHTML = 'ยังไม่มีการตัดบัตร — กด <b>ปิด / Done</b> มุมจอเพื่อกลับไปที่แอป HOP'
  } else if (s === 'portal') {
    document.getElementById('icon').textContent = '💳'
    document.getElementById('title').textContent = 'บันทึกการตั้งค่าแล้ว'
    document.getElementById('msg').innerHTML = 'กด <b>ปิด / Done</b> มุมจอเพื่อกลับไปที่แอป HOP'
  }
</script>
</body>
</html>
